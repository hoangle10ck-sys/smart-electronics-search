<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechFind — Tìm sản phẩm điện tử theo nhu cầu</title>
    <meta name="description" content="Mô tả nhu cầu, tìm sản phẩm điện tử đã xác minh và so sánh giá cùng thông số trước khi chọn." />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('smart-electronics-theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
